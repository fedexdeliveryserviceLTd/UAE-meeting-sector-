<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d32"><title>Admin Dashboard | UAE Meeting Sector</title>
<style>
:root{--navy:#101d32;--gold:#c9a45c;--ink:#182235;--muted:#667085;--paper:#f5f6f8}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Arial,Helvetica,sans-serif}header{background:var(--navy);color:white;padding:22px max(18px,calc((100% - 1000px)/2));border-bottom:4px solid var(--gold)}header b{letter-spacing:.12em}main{max-width:1000px;margin:30px auto;padding:0 18px}.panel{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:22px;margin-bottom:18px}h1,h2{font-family:Georgia,serif}label{display:block;margin:12px 0 5px;font-weight:700}input,textarea{width:100%;padding:11px;border:1px solid #d0d5dd;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:10px 14px;background:var(--navy);color:#fff;font-weight:700;cursor:pointer;margin:6px 6px 6px 0}.approve{background:#176344}.reject{background:#923838}.hidden{display:none!important}.note{background:#f2f4f7;padding:12px;border-radius:8px;margin-top:12px;white-space:pre-wrap}.item{border:1px solid #e5e7eb;border-radius:12px;padding:16px;margin:14px 0}.meta{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.stat{background:#f7f8fa;border:1px solid #e5e7eb;border-radius:10px;padding:12px}.stat strong{display:block;font-size:25px;color:var(--navy)}.filters{display:grid;grid-template-columns:1fr 180px;gap:10px;margin:14px 0}.tag{display:inline-block;padding:3px 9px;border-radius:20px;background:#f3ead7;color:#6b5425;font-size:12px;font-weight:700}a{color:#8a6a2d}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><b>✦ UAE MEETING SECTOR</b><div>Private administration · Meeting review</div></header><main>
<section class="panel"><h1>Admin dashboard</h1><p class="meta">Sign in with the authorised administrator account. Access is checked against the private administrator list.</p>
<div id="login"><label>Email address</label><input id="email" type="email" autocomplete="username"><label>Password</label><input id="password" type="password" autocomplete="current-password"><button id="signin">Sign in</button></div>
<div id="tools" class="hidden"><p id="who"></p><button id="refresh">Refresh requests</button><button id="signout">Sign out</button></div><div id="message" class="note" role="status">Admin access is restricted.</div></section>
<section class="panel hidden" id="list"><h2>Meeting requests</h2><div class="stats"><div class="stat">Pending<strong id="pendingCount">0</strong></div><div class="stat">Approved<strong id="approvedCount">0</strong></div><div class="stat">Rejected<strong id="rejectedCount">0</strong></div></div><div class="filters"><input id="searchRequests" type="search" placeholder="Search name, email, organisation…"><select id="statusFilter" aria-label="Filter by status"><option value="all">All requests</option><option value="pending">Pending only</option><option value="approved">Approved only</option><option value="rejected">Rejected only</option></select></div><div id="requests"></div></section><p><a href="index.html">← Back to meeting request page</a></p>
</main><script>
const $=id=>document.getElementById(id),say=t=>$('message').textContent=t;let active=false;let db=null;try{if(!window.supabase||!window.supabase.createClient)throw new Error('The sign-in service did not load. Refresh this page and try again.');db=window.supabase.createClient('https://mowqpnvyszvfulzsfvst.supabase.co','sb_publishable_a2Q2flrQ7uuNESOH3tbgWw_irmKRyiD',{auth:{autoRefreshToken:true,persistSession:true,detectSessionInUrl:false,storageKey:'uae-meeting-sector-auth'}});}catch(e){say(e.message)}
async function check(sessionOverride){try{if(!db){say('Sign-in service did not load. Refresh this page.');return}let session=sessionOverride||null;if(!sessionOverride){const {data,error:sessionError}=await db.auth.getSession();if(sessionError){say('Could not read sign-in session: '+sessionError.message);return}session=data.session;}if(!session){active=false;$('login').classList.remove('hidden');$('tools').classList.add('hidden');$('list').classList.add('hidden');say('Not signed in. Enter your email and password.');return}say('Signed in as '+session.user.email+'. Checking administrator permission…');const result=await db.from('meeting_admins').select('user_id').eq('user_id',session.user.id).maybeSingle();if(result.error){active=false;say('You are signed in, but the admin permission check failed: '+result.error.message);return}if(!result.data){active=false;say('Signed in as '+session.user.email+', but this login is not linked to an administrator record. Contact support.');return}active=true;$('login').classList.add('hidden');$('tools').classList.remove('hidden');$('list').classList.remove('hidden');$('who').textContent='Signed in: '+session.user.email;say('Administrator access verified.');await load()}catch(e){say('Dashboard check error: '+(e.message||String(e)))}}
let allRequests=[];
async function load(){
 if(!db||!active){say('Please sign in with the authorised administrator account.');return}
 say('Loading meeting requests…');
 const {data,error}=await db.from('meeting_requests').select('id,full_name,email,phone,organization,meeting_purpose,preferred_date,preferred_time,status,admin_notes,reviewed_at,created_at').order('created_at',{ascending:false});
 if(error){say('Could not load meeting requests: '+error.message);return}
 allRequests=data||[];
 $('pendingCount').textContent=allRequests.filter(r=>r.status==='pending').length;
 $('approvedCount').textContent=allRequests.filter(r=>r.status==='approved').length;
 $('rejectedCount').textContent=allRequests.filter(r=>r.status==='rejected').length;
 renderRequests();
 say('Requests loaded successfully.');
}

function renderRequests(){
 const root=$('requests');root.replaceChildren();
 const filter=$('statusFilter').value,term=$('searchRequests').value.trim().toLowerCase();
 const visible=allRequests.filter(r=>(filter==='all'||r.status===filter)&&(!term||[r.full_name,r.email,r.organization,r.meeting_purpose,r.phone].filter(Boolean).join(' ').toLowerCase().includes(term)));
 if(!visible.length){root.textContent=allRequests.length?'No requests match this search or filter.':'No meeting requests yet.';return}
 for(const r of visible){const el=document.createElement('article');el.className='item';const title=document.createElement('h3');title.textContent=r.full_name;const tag=document.createElement('span');tag.className='tag';tag.textContent=r.status.toUpperCase();const details=document.createElement('p');details.className='meta';details.textContent=[r.email,r.phone,r.organization,'Preferred: '+r.preferred_date+' at '+String(r.preferred_time).slice(0,5)+' Dubai time','Submitted: '+new Date(r.created_at).toLocaleString()].filter(Boolean).join(' · ');const purpose=document.createElement('p');purpose.textContent=r.meeting_purpose;const note=document.createElement('textarea');note.placeholder='Optional administrator note';note.value=r.admin_notes||'';note.maxLength=2000;el.append(title,tag,details,purpose,note);if(r.status==='pending'){const yes=document.createElement('button');yes.className='approve';yes.textContent='Approve';yes.onclick=()=>review(r.id,'approved',note.value);const no=document.createElement('button');no.className='reject';no.textContent='Reject';no.onclick=()=>review(r.id,'rejected',note.value);el.append(yes,no)}else{const saved=document.createElement('p');saved.className='meta';saved.textContent='Reviewed '+(r.reviewed_at?new Date(r.reviewed_at).toLocaleString():'');el.append(saved)}root.append(el)}}
async function review(id,status,notes){const {error}=await db.from('meeting_requests').update({status,admin_notes:notes.trim()||null,reviewed_at:new Date().toISOString()}).eq('id',id);if(error){say('Update failed: '+error.message);return}say('Request marked '+status+'. Sending applicant notification…');try{const {data}=await db.auth.getSession();if(data.session){await fetch('https://mowqpnvyszvfulzsfvst.supabase.co/functions/v1/send-meeting-notification',{method:'POST',headers:{'Content-Type':'application/json','apikey':'sb_publishable_a2Q2flrQ7uuNESOH3tbgWw_irmKRyiD','Authorization':'Bearer '+data.session.access_token},body:JSON.stringify({type:'decision',request_id:id})})}}catch(e){console.warn('Email notification failed:',e)}say('Request marked '+status+'.');await load()}
$('signin').addEventListener('click',async()=>{try{if(!db){say('Sign-in service is not ready. Refresh the page.');return}const email=$('email').value.trim(),password=$('password').value;if(!email||!password){say('Enter your email address and password first.');return}const btn=$('signin');btn.disabled=true;btn.textContent='Signing in…';say('Connecting securely…');const {data,error}=await db.auth.signInWithPassword({email,password});if(error){say('Sign-in failed: '+error.message);return}if(!data.session){say('Login returned no session. Please try again.');return}await check(data.session)}catch(e){say('Sign-in error: '+(e.message||'Please refresh and try again.'))}finally{$('signin').disabled=false;$('signin').textContent='Sign in'}});$('refresh').onclick=load;$('searchRequests').addEventListener('input',renderRequests);$('statusFilter').addEventListener('change',renderRequests);$('signout').onclick=async()=>{await db.auth.signOut();await check();say('Signed out.')};if(db){check().catch(e=>say('Dashboard error: '+e.message))}
</script></body></html>
